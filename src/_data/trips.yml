# Trip manifest. List order = display order (newest first).
# Each entry:
#   slug          - URL segment and journeys/<slug>.json filename
#   polarsteps_id - public Polarsteps trip id, fetched by data/fetch.py
#   title         - display name
#   summary       - one-line blurb for the /trips cards and trip hero
#   hero          - optional ImageKit path for the card image; omit to use the
#                   first step photo
#   published     - false keeps the trip out of the build (still fetched)

- slug: the-big-trip
  polarsteps_id: 5149612
  title: "The Big Trip"
  summary: "A year the long way round — London to Dubai, Australia, and back through Southeast Asia."
  hero: "r2/images/journey/step/B2EDEC67-90E8-4336-8C67-EEC4C206A723/5CD77A5C-744D-4E86-810E-174F49071369"
  published: true
