source: src
include: [_headers, _redirects]
destination: build
# Dates are formatted in UTC. Trip steps store a UTC `arrived` timestamp plus a
# per-step `tz_offset` (seconds) that the trip/step layouts add before
# formatting, so each place shows in its own local time.
timezone: Etc/UTC

title: "Totally Wanderlost"
description: "Follow along as Nicole and James get lost and travel the world"
permalink: /blog/:slug

instagram: "https://instagram.com/totallywanderlost"
github: "https://github.com/totallywanderlost"
copyright_name: "Nicole Kay & James White"

defaults:
  - scope:
      path: "" # empty string for all files
      type: posts # limit to posts
    values:
      is_post: true # automatically set is_post=true for all posts

plugins:
  - jekyll-minifier
  - jekyll-sitemap

jekyll-minifier:
  remove_intertag_spaces: true
  uglifier_args:
    harmony: true

# Trip and step pages are generated by src/_plugins/trip_pages.rb from
# src/_data/trips.yml + src/_data/journeys/<slug>.json.
